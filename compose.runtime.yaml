services:
  qqbot:
    image: local/nonebot-qq:1.7.2
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "${QQBOT_BIND_ADDRESS:-127.0.0.1}:${QQBOT_HOST_PORT:-8080}:8080"
    volumes:
      - bot-data:/app/data
      - type: bind
        source: ./qq-menu.json
        target: /app/qq-menu.json
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
